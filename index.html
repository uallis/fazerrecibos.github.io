<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recibo de Pagamento</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(160deg, #e0f2fe 0%, #f0f9ff 50%, #ffffff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(14, 165, 233, 0.12);
      max-width: 420px;
      width: 100%;
      padding: 40px 32px;
      text-align: center;
    }

    .logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 8px 20px rgba(14, 165, 233, 0.3);
    }

    .logo svg {
      width: 34px;
      height: 34px;
      fill: white;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #64748b;
      margin-bottom: 20px;
    }

    .title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #0284c7;
      line-height: 1.3;
      margin-bottom: 12px;
    }

    .desc {
      font-size: 0.95rem;
      color: #475569;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .features {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: #334155;
      font-weight: 500;
    }

    .feature span {
      font-size: 1.1rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(90deg, #22c55e, #16a34a);
      color: white;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 16px 28px;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(34, 197, 94, 0.35);
      transition: all 0.2s ease;
      width: 100%;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(34, 197, 94, 0.4);
    }

    .btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .note {
      margin-top: 16px;
      font-size: 0.8rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 2l5 5h-5V4zM8 14h8v2H8v-2zm0-4h8v2H8v-2z"/></svg>
    </div>

    <h1>Recibo de Pagamento</h1>
    <p class="subtitle">Recibos e Orçamentos</p>

    <p class="title">Crie recibos e orçamentos<br>em segundos!</p>
    <p class="desc">Simples, rápido e profissional.<br>Ideal para autônomos e pequenos negócios.</p>

    <div class="features">
      <div class="feature"><span>📄</span> PDF</div>
      <div class="feature"><span>📲</span> WhatsApp</div>
      <div class="feature"><span>🔒</span> Offline</div>
    </div>

    <a href="https://play.google.com/store/apps/details?id=com.uscapps.geradorderecibo" 
       class="btn" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M3.609 1.814L13.792 12 3.61 22.186a.996.996 0 0 1-.61-.92V2.734a1 1 0 0 1 .609-.92zm10.89 10.893l2.302 2.302-10.937 6.333 8.635-8.635zm3.199-3.199l2.302 2.302a1.5 1.5 0 0 1 0 2.12l-2.302 2.302L15.206 12l2.492-2.492zM5.864 2.658L16.8 8.99l-2.302 2.302L5.864 2.658z"/></svg>
      Baixar no Google Play
    </a>

    <p class="note">Gratuito • Android</p>
  </div>
</body>
</html>
