<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recibo de Pagamento</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(160deg, #e0f2fe 0%, #f0f9ff 60%, #fff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(14, 165, 233, 0.15);
      max-width: 380px;
      width: 100%;
      padding: 36px 28px;
      text-align: center;
    }

    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      margin: 0 auto 18px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      overflow: hidden;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .sub {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 18px;
    }

    .headline {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0284c7;
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .desc {
      font-size: 0.95rem;
      color: #475569;
      margin-bottom: 24px;
      line-height: 1.45;
    }

    .tags {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .tag {
      background: #f1f5f9;
      color: #334155;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(90deg, #22c55e, #16a34a);
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 16px 24px;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(34, 197, 94, 0.4);
      transition: all 0.2s ease;
      width: 100%;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(34, 197, 94, 0.45);
    }

    .btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .note {
      margin-top: 14px;
      font-size: 0.8rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="https://play-lh.googleusercontent.com/kaOgZ8FTG1e_EXKG5DdBEYBj4mK_HBqfI2idQa5gCOef2uU0frXlKVL49CHdzGvOoDaHRCZf0O8C-Xew6scvVg=s180-rw" 
           alt="Recibo de Pagamento">
    </div>

    <h1>Recibo de Pagamento</h1>
    <p class="sub">Recibos e Orçamentos em PDF</p>

    <p class="headline">Crie recibos profissionais<br>em segundos</p>
    <p class="desc">Simples, rápido e grátis.<br>Ideal para autônomos e pequenos negócios.</p>

    <div class="tags">
      <span class="tag">📄 PDF</span>
      <span class="tag">📲 WhatsApp</span>
      <span class="tag">🔒 Offline</span>
    </div>

    <a href="https://play.google.com/store/apps/details?id=com.uscapps.geradorderecibo" 
       class="btn" 
       target="_blank" 
       rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M3.609 1.814L13.792 12 3.61 22.186a.996.996 0 0 1-.61-.92V2.734a1 1 0 0 1 .609-.92zm10.89 10.893l2.302 2.302-10.937 6.333 8.635-8.635zm3.199-3.199l2.302 2.302a1.5 1.5 0 0 1 0 2.12l-2.302 2.302L15.206 12l2.492-2.492zM5.864 2.658L16.8 8.99l-2.302 2.302L5.864 2.658z"/></svg>
      Baixar no Google Play
    </a>

    <p class="note">Gratuito • Android</p>
  </div>
</body>
</html>
